name: deploy-studio
# Field Studio 远程版：push 触发自动部署（AGENTS 规则 7：部署必须由 GitHub push/merge 触发）
# 首次使用前需在仓库 Settings → Secrets 配置：
#   CLOUDFLARE_API_TOKEN  —— 权限：Workers Scripts:Edit、D1:Edit、R2:Edit、Zone→Workers Routes:Edit
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 账户 ID
on:
  push:
    branches: [main]
    paths:
      - 'studio-remote/**'
      - '.github/workflows/studio-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: studio-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Guard - 未配置 secrets 时告警并跳过（配置后自动生效）
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::本次 push 未部署 Studio：仓库 Secrets 缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（Settings → Secrets and variables → Actions）"
            echo "### ⚠️ 本次 push 未部署 Studio" >> "$GITHUB_STEP_SUMMARY"
            echo "仓库 Secrets 缺少 **CLOUDFLARE_API_TOKEN** / **CLOUDFLARE_ACCOUNT_ID**，wrangler deploy 已跳过。" >> "$GITHUB_STEP_SUMMARY"
            echo "到 GitHub 仓库 Settings → Secrets and variables → Actions 配置后，push 才会真正部署。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy（npm ci + wrangler deploy，显式工作目录）
        if: steps.guard.outputs.skip != 'true'
        working-directory: studio-remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy
